# Builds the hydradb dev image (same Dockerfile docker-compose.yml uses) and
# publishes it to GHCR as ghcr.io/diversexl/hydracode/hydradb.
#
# Tags published:
#   - on every push to main:  latest, sha-<short-sha>
#   - on every v* tag:        <version> (e.g. 0.1.0), latest, sha-<short-sha>
#
# Auth is the built-in GITHUB_TOKEN (packages: write), so no secrets are
# needed. The first run takes 10-30+ minutes (Rust release build); subsequent
# runs reuse the GHA layer cache.

name: publish-docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/hydradb
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/hydradb.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

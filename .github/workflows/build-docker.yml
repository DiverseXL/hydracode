# Builds the hydradb image (same Dockerfile docker-compose.yml and
# publish-docker.yml use) on PRs that touch the Docker build, so regressions
# are caught before merge. Build-only — nothing is pushed; publishing happens
# in publish-docker.yml.
#
# Runs only when docker/ (Dockerfile, entrypoint.sh) or this workflow changes,
# since nothing else can affect the image. Use "Run workflow" (workflow_dispatch)
# to force a build on a PR that didn't touch docker/.
#
# Caching: reads the layer cache written by the publish workflow on main
# (scope=main), so PR builds skip the 10-30 min Rust compile when the image
# didn't meaningfully change; writes to this PR's own scope so PRs never
# pollute the main cache.

name: build-docker

on:
  pull_request:
    paths:
      - docker/**
      - .github/workflows/build-docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/hydradb.Dockerfile
          push: false
          load: true
          tags: hydradb:pr-check
          cache-from: type=gha,scope=main
          cache-to: type=gha,mode=max
